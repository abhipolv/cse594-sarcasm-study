[project]
name = "sarcasm-study"
version = "0.1.0"
description = "Human-subjects study app for CSE 594 Assignment 3 (sarcasm detection with/without AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",   # needed by FastAPI's TestClient
    "pytest>=8",
]

[tool.uv]
package = false
